name: Expired Domain Hunter

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send a one-time Telegram integration test message"
        required: false
        default: false
        type: boolean
      skip_wayback:
        description: "Skip Wayback checks for a fast sample run"
        required: false
        default: false
        type: boolean
      reset_state:
        description: "Clear cached processed-domain state for a fresh manual verification"
        required: false
        default: false
        type: boolean
      availability_budget:
        description: "Maximum Verisign .COM RDAP checks for this manual run"
        required: false
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore processed-domain state
        uses: actions/cache@v4
        with:
          path: .state
          key: expired-domain-hunter-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            expired-domain-hunter-state-${{ github.ref_name }}-

      - name: Reset state for explicit manual verification
        if: ${{ inputs.reset_state == true }}
        run: rm -rf .state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Collect latest compliant expired and dropped domains
        run: python collector.py --output input/domains.csv --summary output/collection_summary.json --fallback input/domains.csv

      - name: Run Telegram integration test when requested
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hunter.py --telegram-test

      - name: Run hand-registration hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AVAILABILITY_MAX_REQUESTS: ${{ inputs.availability_budget || '50' }}
          AVAILABILITY_TIMEOUT_SECONDS: "4"
          AVAILABILITY_RETRIES: "0"
          WAYBACK_MAX_REQUESTS: "5"
          WAYBACK_TIMEOUT_SECONDS: "8"
          WAYBACK_RETRIES: "1"
        run: >-
          python hunter.py
          ${{ inputs.skip_wayback == true && '--skip-wayback' || '' }}
          --max-availability ${{ inputs.availability_budget || '50' }}
          --availability-timeout 4
          --max-wayback 5
          --send-telegram

      - name: Upload hunter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expired-domain-hunter-results-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
