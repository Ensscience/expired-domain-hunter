name: Expired Domain Hunter

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send a one-time Telegram integration test message"
        required: false
        default: false
        type: boolean
      skip_wayback:
        description: "Skip Wayback checks for a fast offline/sample run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Collect latest public expired and dropped domains
        run: python collector.py --output input/domains.csv --summary output/collection_summary.json --fallback input/domains.csv

      - name: Run Telegram integration test when requested
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hunter.py --telegram-test

      - name: Run domain hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python hunter.py
          ${{ inputs.skip_wayback == true && '--skip-wayback' || '' }}
          --send-telegram

      - name: Upload hunter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expired-domain-hunter-results-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
